{% extends "base.html" %}
{% block content %}
<div class="container my-4" style="max-width: 900px;">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-dark mb-2">Welcome, {{ username }}! 👋</h2>
        <p class="text-muted">Select a language below to explore lessons and test your skills with our 50-question quiz.</p>
    </div>

    <div class="row g-4">
        {% for lang in languages %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column justify-content-between p-4">
                    <div>
                        <h5 class="card-title fw-bold text-primary mb-1">{{ lang.name }}</h5>
                        <small class="text-muted text-uppercase">Code: {{ lang.code }}</small>
                    </div>
                    <div class="mt-4 d-grid gap-2">
                        <a href="{{ url_for('lesson', lang_id=lang.id) }}" class="btn btn-outline-primary btn-sm fw-semibold">
                            📖 Study Lessons
                        </a>
                        <a href="{{ url_for('quiz', lang_id=lang.id) }}" class="btn btn-outline-success btn-sm fw-semibold">
                            ✍️ Take Quiz (50 Qs)
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
