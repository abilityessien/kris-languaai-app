{% extends "base.html" %}
{% block content %}
<div class="container my-5" style="max-width: 1000px;">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-dark mb-2">Welcome, {{ username }}! 👋</h2>
        <p class="text-muted lead fs-6">Select a language below to explore lessons and test your skills with our interactive quizzes.</p>
    </div>

    <div class="row g-4">
        {% for lang in languages %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 rounded-3 transition-hover">
                <div class="card-body d-flex flex-column justify-content-between p-4">
                    <div>
                        <h5 class="card-title fw-bold mb-1" style="color: #4f46e5;">{{ lang.name }}</h5>
                        <span class="badge bg-light text-secondary border uppercase text-xs px-2 py-1">Code: {{ lang.code }}</span>
                    </div>
                    <div class="mt-4 d-grid gap-2">
                        <a href="{{ url_for('lesson', lang_id=lang.id) }}" class="btn btn-outline-primary btn-sm fw-semibold py-2">
                            📖 Study Lessons
                        </a>
                        <a href="{{ url_for('quiz', lang_id=lang.id) }}" class="btn btn-sm text-white fw-semibold py-2" style="background-color: #4f46e5; border-color: #4f46e5;">
                            ✍️ Take Quiz
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
