{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm mx-auto p-4 border-0 rounded-3" style="max-width: 400px;">
    <h2 class="text-center fw-bold mb-4 text-dark">Create Account</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn text-white w-100 py-2 fw-semibold shadow-sm" style="background-color: #4f46e5; border-color: #4f46e5;">Register</button>
    </form>
    <p class="text-center text-muted small mt-3">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold" style="color: #4f46e5;">Login here</a></p>
</div>
{% endblock %}
